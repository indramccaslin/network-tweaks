# =====================================================================
# Network Tweaks - konfigurasi (v1.0.0)
# =====================================================================

# MODE: global | gaming | streaming | download
MODE=global

# ----- MASTER SWITCHES -----
NET_TCP=true
NET_CORE=true
NET_QOS=true
NET_DNS=true
NET_ADV=true

# ----- GAME DETECTION -----
GP_DYNAMIC=true
GP_POLL=2

# ----- PROFILE PRESETS -----
# gaming: ultra low latency (BBR, notsent_lowat kecil, busy poll)
# streaming: balanced low buffer, smooth playback
# download: max throughput (large buffers, high backlog)

# ----- TCP TUNING -----
TCP_CONG_ALGO=bbr
TCP_LOW_LATENCY=1
TCP_FASTOPEN=3
TCP_AUTOCORKING=0
TCP_SLOW_START_AFTER_IDLE=0
TCP_NO_METRICS_SAVE=1
TCP_TW_REUSE=1
TCP_TW_RECYCLE=0
TCP_FIN_TIMEOUT=15
TCP_KEEPALIVE_TIME=7200
TCP_KEEPALIVE_PROBES=9
TCP_KEEPALIVE_INTVL=75
TCP_SYNACK_RETRIES=2
TCP_SYN_RETRIES=2

# ----- BUFFER TUNING -----
NET_RMEM_MAX=33554432
NET_WMEM_MAX=33554432
NET_RMEM_DEFAULT=262144
NET_WMEM_DEFAULT=262144
TCP_RMEM="4096 87380 33554432"
TCP_WMEM="4096 65536 33554432"
NET_SOMAXCONN=4096
NET_TCP_MAX_SYN_BACKLOG=4096
NET_CORE_NETDEV_MAX_BACKLOG=10000
NET_CORE_DEFAULT_QDISC=fq

# ----- GAME PROFILE (active saat game + mode gaming) -----
GAME_TCP_CONG_ALGO=bbr
GAME_NET_RMEM_MAX=33554432
GAME_NET_WMEM_MAX=33554432
GAME_TCP_RMEM="4096 87380 33554432"
GAME_TCP_WMEM="4096 65536 33554432"
GAME_NET_SOMAXCONN=4096
GAME_NET_TCP_MAX_SYN_BACKLOG=4096
GAME_NET_CORE_NETDEV_MAX_BACKLOG=10000
GAME_NET_CORE_DEFAULT_QDISC=fq
GAME_TCP_AUTOCORKING=0
GAME_TCP_SLOW_START_AFTER_IDLE=0
GAME_TCP_NO_METRICS_SAVE=1
GAME_TCP_FASTOPEN=3
GAME_NET_NOTSENT_LOWAT=16384
GAME_NET_CORE_BUSY_POLL=50
GAME_NET_CORE_BUSY_READ=50

# ----- STREAMING PROFILE -----
STREAM_TCP_CONG_ALGO=bbr
STREAM_NET_RMEM_MAX=16777216
STREAM_NET_WMEM_MAX=16777216
STREAM_TCP_RMEM="4096 87380 16777216"
STREAM_TCP_WMEM="4096 65536 16777216"
STREAM_NET_SOMAXCONN=2048
STREAM_NET_TCP_MAX_SYN_BACKLOG=2048
STREAM_NET_CORE_NETDEV_MAX_BACKLOG=5000
STREAM_NET_CORE_DEFAULT_QDISC=fq_codel
STREAM_TCP_AUTOCORKING=1
STREAM_TCP_SLOW_START_AFTER_IDLE=1
STREAM_TCP_NO_METRICS_SAVE=1
STREAM_TCP_FASTOPEN=3
STREAM_NET_NOTSENT_LOWAT=32768
STREAM_NET_CORE_BUSY_POLL=30
STREAM_NET_CORE_BUSY_READ=30

# ----- DOWNLOAD PROFILE -----
DOWNLOAD_TCP_CONG_ALGO=cubic
DOWNLOAD_NET_RMEM_MAX=67108864
DOWNLOAD_NET_WMEM_MAX=67108864
DOWNLOAD_TCP_RMEM="4096 131072 67108864"
DOWNLOAD_TCP_WMEM="4096 131072 67108864"
DOWNLOAD_NET_SOMAXCONN=8192
DOWNLOAD_NET_TCP_MAX_SYN_BACKLOG=8192
DOWNLOAD_NET_CORE_NETDEV_MAX_BACKLOG=20000
DOWNLOAD_NET_CORE_DEFAULT_QDISC=fq
DOWNLOAD_TCP_AUTOCORKING=1
DOWNLOAD_TCP_SLOW_START_AFTER_IDLE=0
DOWNLOAD_TCP_NO_METRICS_SAVE=0
DOWNLOAD_TCP_FASTOPEN=3
DOWNLOAD_NET_NOTSENT_LOWAT=65536
DOWNLOAD_NET_CORE_BUSY_POLL=0
DOWNLOAD_NET_CORE_BUSY_READ=0

# ----- NETWORK CORE -----
NET_IPV4_IP_NO_PMTU_DISC=0
NET_CORE_BUSY_POLL=50
NET_CORE_BUSY_READ=50

# ----- LATENCY BOOST (game only) -----
NET_GAME_BOOST=true
NET_NOTSENT_LOWAT=16384

# ----- MTU (0 = auto) -----
MTU=0

# ----- DNS -----
DNS1=1.1.1.1
DNS2=8.8.8.8
DNS_AUTO=false

# ----- WI-FI / MOBILE OPTIMIZATION -----
WIFI_OPT=true
MOBILE_OPT=true
